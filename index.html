<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF9F1" />
    <meta name="description" content="Little Learners Adventure — an interactive preschool learning app for ages 2-6. Listen, touch, trace, play, and learn." />

    <!-- Installable as a Home Screen app (Android/Chrome via the manifest above; iOS/Safari via these tags, which it does not read from the manifest). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lil Learners" />

    <title>Little Learners Adventure</title>

    <!-- GitHub Pages SPA deep-link support: github.com/rafgraph/spa-github-pages.
         Only activates when index.html was reached via the 404.html redirect
         below; a no-op on every other host (this artifact preview included). -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
